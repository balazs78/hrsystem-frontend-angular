<div class="auth-container">
  <mat-card class="password-card">
    <mat-card-header>
      <mat-card-title>Security Update Required</mat-card-title>
      <mat-card-subtitle>For security, you must change the temporary password assigned by your administrator.</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <app-password-update
        [currentPasswordTitle]="'Current temporary password'"
        [submitButtonLabel]="'Update password & Login'"
      >

      </app-password-update>
    </mat-card-content>
  </mat-card>
</div>
