<mat-card>
<app-table-toolbar>
  <app-primary-button *appHasRole="['Admin', 'HR Manager']" (click)="editDepartment()">
    New department
  </app-primary-button>

  <mat-form-field class="search-filter">
    <mat-label>Search departments</mat-label>
    <input matInput type="text" (keyup)="applyFilter($event)" />
  </mat-form-field>
</app-table-toolbar>

<app-responsive-table>
  <table mat-table class="mat-elevation-z8"
    [dataSource]="dataSource"
    matSort matSortActive="name" matSortDirection="asc" matSortDisableClear>

  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef [disableClear]="true" mat-sort-header>Name</th>
    <td mat-cell *matCellDef="let department">
      {{ department.name }}
    </td>
  </ng-container>

  <ng-container matColumnDef="headcount">
    <th mat-header-cell *matHeaderCellDef [disableClear]="true" mat-sort-header>Headcount</th>
    <td mat-cell *matCellDef="let department">
      {{ department.stats.headcount }}
    </td>
  </ng-container>

  <ng-container matColumnDef="manager">
    <th mat-header-cell *matHeaderCellDef [disableClear]="true" mat-sort-header>Manager</th>
    <td mat-cell *matCellDef="let department">
      {{ department.manager?.fullName }}
    </td>
  </ng-container>

  <ng-container matColumnDef="action">
    <th mat-header-cell *matHeaderCellDef>Action</th>
    <td mat-cell *matCellDef="let department">
      <button mat-icon-button title="Edit" *appHasRole="['Admin', 'HR Manager']" (click)="editDepartment(department)">
        <mat-icon>edit</mat-icon>
      </button>
      <button mat-icon-button title="Delete" *appHasRole="['Admin', 'HR Manager']" [disabled]="department.stats.headcount > 0" (click)="deleteDepartment(department)">
        <mat-icon>delete</mat-icon>
      </button>
      <button mat-icon-button title="View" *appHasRole="['Manager', 'Auditor']" (click)="viewDepartment(department)">
        <mat-icon>visibility</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let department; columns: displayedColumns"></tr>
   <tr *matNoDataRow>
      <td [attr.colspan]="displayedColumns.length">No records found</td>
   </tr>
  </table>
</app-responsive-table>

<mat-paginator
  [pageSizeOptions]="[10,20,50]"
  [pageSize]="10"
  showFirstLastButtons>
</mat-paginator>

</mat-card>
