<mat-card class="table-card">
    <app-responsive-table>
        <table mat-table [dataSource]="dataSource">
            <ng-container matColumnDef="fullName">
                <th mat-header-cell *matHeaderCellDef>Employee name</th>
                <td mat-cell *matCellDef="let employee">{{ employee.fullName }}</td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let employee; columns: displayedColumns"></tr>
            <tr *matNoDataRow>
                <td class="mat-cell" [attr.colspan]="displayedColumns.length">No onboarding employees</td>
            </tr>
        </table>
    </app-responsive-table>

    <mat-paginator
        [pageSize]="pageSize"
        [pageSizeOptions]="pageSizeOptions"
        [showFirstLastButtons]="true"
        aria-label="Select page of onboarding employees">
    </mat-paginator>
</mat-card>
