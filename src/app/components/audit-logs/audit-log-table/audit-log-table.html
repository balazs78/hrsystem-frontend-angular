<div class="audit-log-table">
  @if (loading) {
    <div class="loading-wrap">
      <mat-spinner diameter="32"></mat-spinner>
    </div>
  }

  <app-responsive-table>
    <table mat-table [dataSource]="auditLogs" matSort matSortActive="created_at" matSortDirection="desc" matSortDisableClear (matSortChange)="sortChange.emit($event)" class="mat-elevation-z8">

    <ng-container matColumnDef="created_at">
      <th mat-header-cell *matHeaderCellDef mat-sort-header="created_at">Date</th>
      <td mat-cell *matCellDef="let row">{{row.created_at}}</td>
    </ng-container>

    <ng-container matColumnDef="action">
      <th mat-header-cell *matHeaderCellDef>Action</th>
      <td mat-cell *matCellDef="let row">{{row.action}}</td>
    </ng-container>

    <ng-container matColumnDef="user">
      <th mat-header-cell *matHeaderCellDef>User</th>
      <td mat-cell *matCellDef="let row">{{row.user?.name}}</td>
    </ng-container>

    <ng-container matColumnDef="employee">
      <th mat-header-cell *matHeaderCellDef>Employee</th>
      <td mat-cell *matCellDef="let row">{{row.employee?.name}}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
     <tr *matNoDataRow>
        <td [attr.colspan]="displayedColumns.length">No records found</td>
     </tr>
    </table>
  </app-responsive-table>
</div>
